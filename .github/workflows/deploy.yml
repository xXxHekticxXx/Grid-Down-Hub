name: Deploy Grid-Down Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle the Army survival manual
        run: |
          mkdir -p public/library
          for u in "https://irp.fas.org/doddir/army/atp3-50-21.pdf" "https://armypubs.army.mil/epubs/DR_pubs/DR_a/pdf/web/ARN12086_ATP%203-50x21%20FINAL%20WEB%202.pdf"; do
            if curl -fsSL --max-time 120 -o public/library/atp-3-50-21.pdf "$u" && head -c 4 public/library/atp-3-50-21.pdf | grep -q '%PDF'; then break; fi
            rm -f public/library/atp-3-50-21.pdf
          done
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
